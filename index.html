<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Css/style.css" />
</head>
<body data-page="login">
  <div class="auth-page">
    <div class="auth-card">

      <!-- LEFT SIDE -->
      <div class="auth-left">
        <div class="auth-logo">
          <div class="logo-badge">ET</div>
          <span class="logo-text">Expense Tracker</span>
        </div>
        <h1>Take control<br>of <span>your money.</span></h1>
        <p>A simple way to see your income, expenses and balance in one calm dashboard.</p>
        <div class="auth-stat-card">
          <div class="label">Balance</div>
          <div class="value">₹48,260</div>
          <div class="sub">↗ 12.8%</div>
          <div class="auth-stat-fab">₹</div>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="auth-right">
        <div class="eyebrow">Welcome Back</div>
        <h2>Sign in</h2>
        <p class="subtitle">Enter your details to continue.</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="liEmail">Email</label>
            <input type="email" id="liEmail" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="liPass">Password</label>
            <input type="password" id="liPass" placeholder="••••••••" required />
          </div>
          <div class="error-msg" id="liError"></div>
          <button type="submit" class="btn-primary">
            Sign in <span class="arrow">→</span>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Create one</a>
        </div>
        <span class="admin-link" id="adminLoginLink">Admin login</span>
      </div>

    </div>
  </div>

  <script src="js/jwt.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
